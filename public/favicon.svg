<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Bergen HEMA">
  <!--
    The club's Ochs logo is fine white line art on a wide canvas; scaled to
    16px it collapses into mush. This is a purpose-drawn longsword glyph in the
    same white-on-brand-red, built with strokes heavy enough to survive a
    browser tab.
  -->
  <rect width="32" height="32" rx="6" fill="#C83737"/>
  <g fill="#F5F1EA">
    <!-- blade, tapering to the point -->
    <path d="M16 2.6 18 7.6 18 18.2 14 18.2 14 7.6 Z"/>
    <!-- crossguard -->
    <rect x="5.8" y="18.5" width="20.4" height="2.5" rx="1.25"/>
    <!-- long grip — the feature that makes it a longsword rather than a cross -->
    <rect x="14.6" y="21.4" width="2.8" height="5.4"/>
    <!-- pommel -->
    <circle cx="16" cy="28.2" r="2.4"/>
  </g>
</svg>
